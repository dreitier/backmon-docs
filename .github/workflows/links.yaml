name: External links

# Internal links are checked by every build. External links break without any change in this
# repository, so they are checked on a schedule instead of blocking pull requests.
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Check external links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # configuration: lychee.toml
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress 'docs/**/*.md' 'src/**/*.js' docusaurus.config.js README.md
          fail: true
        env:
          # raises the rate limit for links to github.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
