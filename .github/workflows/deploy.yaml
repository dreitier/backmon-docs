name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# deployments run one after another, so that an older build never replaces a newer one
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yaml

  deploy:
    name: Deploy to GitHub Pages
    needs: ci
    # manual runs only deploy main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # pushes the build to the gh-pages branch
      contents: write
    steps:
      # the site exactly as CI has built and checked it
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website
          path: build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          cname: backmon.dreitier.com
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
