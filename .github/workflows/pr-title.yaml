name: PR title

# The PR title has to be a Conventional Commit (https://www.conventionalcommits.org/), e.g.
# "docs: describe purging" or "ci(deps): bump actions/checkout", like in the other backmon repositories.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    uses: dreitier/shared-ci-components/.github/workflows/conventional-pr-title.yml@486b3fed3ce26e365ef8de6a17cde2ad86b4e269 # v1.3.0
