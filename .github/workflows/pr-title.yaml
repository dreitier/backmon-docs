name: PR title

# The PR title has to be a Conventional Commit (https://www.conventionalcommits.org/), e.g.
# "docs: describe purging" or "ci(deps): bump actions/checkout", like in the other backmon repositories.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    uses: dreitier/shared-ci-components/.github/workflows/conventional-pr-title.yml@1ba590342248df7855a136be3420378586d139d6 # v1.2.0
