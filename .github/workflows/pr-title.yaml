name: PR title

# The PR title has to be a Conventional Commit (https://www.conventionalcommits.org/), e.g.
# "docs: describe purging" or "ci(deps): bump actions/checkout", like in the other backmon repositories.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    name: Conventional Commit
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
